<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>((()68)))()),</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* --- КОНТРАСТНЫЙ ФОН (Заводной апельсин) --- */
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Impact', 'Arial Black', sans-serif; /* Более дерзкий шрифт */
    padding: 20px;
    /* Резкие полосы: оранжевый, белый, оранжевый, белый */
    background: repeating-linear-gradient(
      45deg,
      #ff6600,
      #ff6600 50px,
      #ffffff 50px,
      #ffffff 100px
    );
    background-size: 200% 200%;
    animation: orangeClockwork 15s linear infinite; /* Медленное движение полос */
    overflow-x: hidden;
  }

  @keyframes orangeClockwork {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* --- КАРТОЧКА --- */
  .card {
    background: #ffffff;
    border: 4px solid #000; /* Жесткая черная рамка */
    border-radius: 0px; /* Убираем скругления для строгости */
    padding: 40px 30px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 12px 12px 0px rgba(0, 0, 0, 1); /* Резкая тень */
    position: relative;
    z-index: 2;
  }

  /* --- АВАТАРКА --- */
  .avatar {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #000;
    background: #eee;
    box-shadow: 4px 4px 0px #ff6600; /* Оранжевая тень */
    transition: transform 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.05) rotate(-5deg); /* Легкий наклон */
  }

  h1 {
    color: #000;
    font-size: 28px;
    margin-bottom: 25px;
    letter-spacing: 1px;
    text-transform: uppercase;
    /* Оранжевый текст с черной обводкой */
    text-shadow: 2px 2px 0px #ff6600, -1px -1px 0px #000; 
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* --- КНОПКИ --- */
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 0; /* Квадратные кнопки */
    background: #ffffff;
    color: #000;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.2s ease;
    border: 3px solid #000;
    cursor: pointer;
    box-shadow: 4px 4px 0px #000;
  }

  /* ЭФФЕКТ ПРИ НАЖАТИИ */
  .link-btn:hover, .link-btn:active {
    background: #ff6600; 
    color: #ffffff;
    transform: translate(2px, 2px); /* Сдвиг при нажатии */
    box-shadow: 2px 2px 0px #000;
  }

  .link-btn .platform {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-btn .icon {
    width: 28px;  
    height: 28px; 
    object-fit: contain; 
    flex-shrink: 0; 
  }

  .link-btn .icon-tiktok {
    width: 32px;   
    height: 32px;
    background: #000; /* Для ТикТока сделаем черный фон иконке */
    border-radius: 4px;
    padding: 2px;
  }

  .link-btn .value {
    color: #555;
    font-size: 14px;
    transition: color 0.3s;
    font-family: 'Arial', sans-serif;
  }

  .link-btn:hover .value {
    color: #fff;
  }

  /* --- ВСПЛЫВАШКА --- */
  .copy-alert {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #ff6600;
    color: #fff;
    padding: 12px 24px;
    border-radius: 0;
    border: 3px solid #000;
    font-weight: bold;
    font-family: 'Impact', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    opacity: 0;
    z-index: 10;
    box-shadow: 5px 5px 0px #000;
  }
  
  .copy-alert.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Аватарка -->
  <img src="https://i.postimg.cc/K883xWbw/1249.jpg" alt="Аватарка" class="avatar">
  
  <!-- Заголовок -->
  <h1>((()68)))()),</h1>

  <div class="links">
    <!-- 1. TELEGRAM -->
    <div class="link-btn tg" onclick="copyText('@hikk2n', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/18whMbBM/1160.png" alt="Telegram" class="icon">
        Telegram
      </span>
      <span class="value">@hikk2n</span>
    </div>

    <!-- 2. DISCORD -->
    <div class="link-btn ds" onclick="copyText('Spec_71782', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/9DZ51sbB/1161.webp" alt="Discord" class="icon">
        Discord
      </span>
      <span class="value">Spec_71782</span>
    </div>

    <!-- 3. TIKTOK -->
    <a href="https://tiktok.com/@dt4me" target="_blank" class="link-btn tt">
      <span class="platform">
        <img src="https://i.postimg.cc/sBJFCStJ/1173.png" alt="TikTok" class="icon icon-tiktok">
        TikTok
      </span>
      <span class="value">@dt4me</span>
    </a>
  </div>
</div>

<div class="copy-alert" id="alert">Скопировано! ✅</div>

<script>
  function copyText(text, element) {
    navigator.clipboard.writeText(text).then(() => {
      const alertBox = document.getElementById('alert');
      alertBox.classList.add('show');
      
      const originalValue = element.querySelector('.value').innerText;
      element.querySelector('.value').innerText = 'Скопировано!';
      
      setTimeout(() => {
        alertBox.classList.remove('show');
        element.querySelector('.value').innerText = originalValue;
      }, 1500);
    });
  }
</script>

</body>
</html>

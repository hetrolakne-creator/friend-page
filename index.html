<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>((()68)))()),</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* --- АНИМИРОВАННЫЙ ОРАНЖЕВО-БЕЛЫЙ ФОН --- */
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
    background: linear-gradient(-45deg, #ffffff, #ffe6cc, #ffd1a3, #ffffff);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    overflow-x: hidden;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* --- СВЕТЛАЯ КАРТОЧКА --- */
  .card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    padding: 40px 30px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(255, 140, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.5);
    position: relative;
    z-index: 2;
  }

  /* --- АВАТАРКА --- */
  .avatar {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    background: #eee;
    box-shadow: 0 0 25px rgba(255, 140, 0, 0.3);
    transition: transform 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.05);
  }

  h1 {
    color: #ff8c00;
    font-size: 26px;
    margin-bottom: 25px;
    letter-spacing: 1.5px;
    text-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* --- КНОПКИ --- */
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.6);
    color: #444;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 140, 0, 0.1);
    cursor: pointer;
  }

  /* ОРАНЖЕВЫЙ ЭФФЕКТ ПРИ НАЖАТИИ */
  .link-btn:hover, .link-btn:active {
    background: #ff8c00; 
    border-color: #ff7300; 
    transform: translateY(-2px);
    color: #ffffff;
    box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3);
  }

  .link-btn .platform {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-btn .icon {
    width: 28px;  
    height: 28px; 
    object-fit: contain; 
    flex-shrink: 0; 
  }

  .link-btn .icon-tiktok {
    width: 32px;   
    height: 32px;
  }

  .link-btn .value {
    color: #888;
    font-size: 14px;
    transition: color 0.3s;
  }

  .link-btn:hover .value {
    color: #fff;
  }

  /* --- ВСПЛЫВАШКА --- */
  .copy-alert {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #ff8c00;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: bold;
    transition: all 0.3s ease;
    opacity: 0;
    z-index: 10;
    box-shadow: 0 5px 20px rgba(255, 140, 0, 0.4);
  }
  
  .copy-alert.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Аватарка друга -->
  <img src="https://i.postimg.cc/K883xWbw/1249.jpg" alt="Аватарка" class="avatar">
  
  <!-- Заголовок друга -->
  <h1>((()68)))()),</h1>

  <div class="links">
    <!-- 1. TELEGRAM (самолетик) -->
    <div class="link-btn tg" onclick="copyText('@hikk2n', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/18whMbBM/1160.png" alt="Telegram" class="icon">
        Telegram
      </span>
      <span class="value">@hikk2n</span>
    </div>

    <!-- 2. DISCORD (фиолетовый) -->
    <div class="link-btn ds" onclick="copyText('Spec_71782', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/9DZ51sbB/1161.webp" alt="Discord" class="icon">
        Discord
      </span>
      <span class="value">Spec_71782</span>
    </div>

    <!-- 3. TIKTOK (нота) -->
    <a href="https://tiktok.com/@dt4me" target="_blank" class="link-btn tt">
      <span class="platform">
        <img src="https://i.postimg.cc/sBJFCStJ/1173.png" alt="TikTok" class="icon icon-tiktok">
        TikTok
      </span>
      <span class="value">@dt4me</span>
    </a>
  </div>
</div>

<div class="copy-alert" id="alert">Скопировано! ✅</div>

<script>
  function copyText(text, element) {
    navigator.clipboard.writeText(text).then(() => {
      const alertBox = document.getElementById('alert');
      alertBox.classList.add('show');
      
      const originalValue = element.querySelector('.value').innerText;
      element.querySelector('.value').innerText = 'Скопировано!';
      
      setTimeout(() => {
        alertBox.classList.remove('show');
        element.querySelector('.value').innerText = originalValue;
      }, 1500);
    });
  }
</script>

</body>
</html>

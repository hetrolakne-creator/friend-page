<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>((()68)))()),</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* --- СТАТИЧНЫЙ ГОРИЗОНТАЛЬНЫЙ ФОН --- */
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
    background: linear-gradient(
      to bottom,
      #ff7f00 0%, #ff7f00 25%,
      #ffffff 25%, #ffffff 50%,
      #ff7f00 50%, #ff7f00 75%,
      #ffffff 75%, #ffffff 100%
    );
  }

  /* --- КАРТОЧКА --- */
  .card {
    background: #ffffff;
    border-radius: 30px; 
    padding: 40px 30px 25px 30px; /* Чуть уменьшил нижний отступ для сердечка */
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15); 
    border: none; 
    position: relative;
    z-index: 2;
  }

  /* --- АВАТАРКА --- */
  .avatar {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ff7f00; 
    background: #f0f0f0;
    transition: transform 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.05);
  }

  h1 {
    color: #333;
    font-size: 26px;
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* --- КНОПКИ --- */
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 16px; 
    background: #f7f7f7; 
    color: #333;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .link-btn:hover, .link-btn:active {
    background: #ff7f00; 
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255, 127, 0, 0.4);
  }

  .link-btn .platform {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-btn .icon {
    width: 28px;  
    height: 28px; 
    object-fit: contain; 
    flex-shrink: 0; 
  }

  .link-btn .icon-tiktok {
    width: 32px;   
    height: 32px;
  }

  .link-btn .value {
    color: #888;
    font-size: 14px;
    transition: color 0.3s;
  }

  .link-btn:hover .value {
    color: #fff;
  }

  /* --- ПАСХАЛОЧКА (СЕРДЕЧКО) --- */
  .easter-egg {
    display: inline-block;
    margin-top: 25px;
    font-size: 14px;
    color: #ccc; /* Серый цвет, чтобы не бросалось в глаза */
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }

  .easter-egg:hover, .easter-egg:active {
    color: #ff7f00; /* Загорается оранжевым */
    transform: scale(1.3) rotate(-10deg); /* Немного увеличивается и наклоняется */
    text-shadow: 0 0 10px rgba(255, 127, 0, 0.5);
  }

</style>
</head>
<body>

<div class="card">
  <img src="https://i.postimg.cc/K883xWbw/1249.jpg" alt="Аватарка" class="avatar">
  
  <h1>((()68)))()),</h1>

  <div class="links">
    <!-- TELEGRAM -->
    <div class="link-btn tg" onclick="copyText('@hikk2n', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/18whMbBM/1160.png" alt="Telegram" class="icon">
        Telegram
      </span>
      <span class="value">@hikk2n</span>
    </div>

    <!-- DISCORD -->
    <div class="link-btn ds" onclick="copyText('Spec_71782', this)">
      <span class="platform">
        <img src="https://i.postimg.cc/9DZ51sbB/1161.webp" alt="Discord" class="icon">
        Discord
      </span>
      <span class="value">Spec_71782</span>
    </div>

    <!-- TIKTOK -->
    <a href="https://tiktok.com/@dt4me84" target="_blank" class="link-btn tt">
      <span class="platform">
        <img src="https://i.postimg.cc/sBJFCStJ/1173.png" alt="TikTok" class="icon icon-tiktok">
        TikTok
      </span>
      <span class="value">@dt4me84</span>
    </a>
  </div>

  <!-- ТА САМАЯ ПАСХАЛОЧКА -->
  <div class="easter-egg" title="Секретик">made with &lt;3</div>

</div>

<div class="copy-alert" id="alert">Скопировано! ✅</div>

<script>
  function copyText(text, element) {
    navigator.clipboard.writeText(text).then(() => {
      const alertBox = document.getElementById('alert');
      alertBox.classList.add('show');
      
      const originalValue = element.querySelector('.value').innerText;
      element.querySelector('.value').innerText = 'Скопировано!';
      
      setTimeout(() => {
        alertBox.classList.remove('show');
        element.querySelector('.value').innerText = originalValue;
      }, 1500);
    });
  }
</script>

</body>
</html>
